<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111318">
<title>Acceso privado · Agency AI OS</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1a1c25;--line:#343342;--text:#f8f7fb;--muted:#aaa7b8;--violet:#a78bfa;--orange:#ff9d55}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 15%,#372c55 0,transparent 42%),radial-gradient(ellipse at 85% 85%,#4b2b1c 0,transparent 35%),var(--bg);font:16px/1.5 Inter,system-ui,sans-serif;color:var(--text)}
main{width:min(100%,440px);padding:34px;border:1px solid var(--line);border-radius:22px;background:#1a1c25ed;box-shadow:0 24px 80px #0008}
.mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--violet),var(--orange));color:#17131e;font-weight:900}
.eyebrow{margin:22px 0 6px;color:var(--violet);font-size:11px;letter-spacing:.16em;font-weight:800}h1{margin:0;font-size:30px;letter-spacing:-.04em}p{color:var(--muted);margin:10px 0 24px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#111318;color:white;font:inherit;outline:none}input:focus{border-color:var(--violet);box-shadow:0 0 0 3px #a78bfa25}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#a78bfa,#f5a15c);color:#17131e;font-weight:800;font-size:14px;cursor:pointer}
#message{min-height:24px;margin:14px 0 0;font-size:13px;color:#ffb3a7}.fine{margin:22px 0 0;font-size:12px;color:#8f8b9e}
</style></head>
<body><main><div class="mark">AI</div><div class="eyebrow">PRIVATE WORKSPACE</div><h1>Acceso de propietaria</h1><p>Introduce tu contraseña privada para habilitar las conexiones protegidas de Agency AI OS.</p>
<form id="login"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512"><button type="submit">Desbloquear espacio privado ↗</button></form>
<div id="message" role="status" aria-live="polite"></div><div class="fine">La sesión se guarda en una cookie segura. No introduzcas aquí claves de Canva ni secretos de API.</div></main>
<script>
const form=document.querySelector("#login"),message=document.querySelector("#message");
(async()=>{try{const r=await fetch("/api/owner-status",{credentials:"same-origin"});const d=await r.json();if(d.authenticated)location.replace("/");if(!d.configured)message.textContent="El acceso aún no está configurado en Cloudflare."; }catch{message.textContent="No se pudo comprobar el estado del acceso.";}})();
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="Comprobando…";try{const r=await fetch("/api/owner-login",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"No se pudo iniciar sesión.");location.replace("/");}catch(err){message.textContent=err.message;}});
</script></body></html>
